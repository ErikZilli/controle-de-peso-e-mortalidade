plugins { id 'com.android.application' }

android {
    namespace 'br.com.controlealojamento.app'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.controlealojamento.app'
        minSdk 23
        targetSdk 28
        versionCode 29
        versionName '1.27'
    }
    // O app web mora em ../../web e entra no APK como assets.
    sourceSets { main { assets.srcDirs = ['../../web'] } }
}
