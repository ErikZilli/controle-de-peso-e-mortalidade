<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4eaee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Peso e Mortalidade">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Controle de Peso e Mortalidade</title>
<style>
:root {
  --bg: #e4eaee; --card: #ffffff; --field: #f8fafb; --line: #d9e1e6; --ink: #14222f; --mute: #6b7c89;
  --accent: #1d6272; --accent-ink: #ffffff; --accent-soft: #e6f0f2; --deep: #223853; --deep-ink: #ffffff; --deep-mute: #9fb0c3;
  --warn: #b4531a; --warn-soft: #fbeee3; --ok: #23805a; --danger: #b3261e;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(40px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2 { margin: 0; font-weight: 800; letter-spacing: -.01em; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 12px; }
.badge { width: 52px; height: 52px; flex: none; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; font-size: 16px; box-shadow: 0 8px 18px -8px var(--accent); }
.top-text { min-width: 0; flex: 1; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
.top h1 { font-size: 26px; line-height: 1.15; overflow-wrap: anywhere; }
.pill { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; color: var(--mute); white-space: nowrap; }
.pill.saved { color: var(--ok); border-color: var(--ok); }
.back { border: 0; background: var(--card); width: 44px; height: 44px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 22px; }

.card { background: var(--card); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.card-head { display: flex; align-items: center; gap: 12px; }
.step { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.card-head h2 { font-size: 20px; }
.card-head p { margin: 2px 0 0; font-size: 13px; color: var(--mute); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.f { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.f label { font-size: 13px; font-weight: 600; color: var(--mute); }
.inp { display: flex; align-items: center; background: var(--field); border: 1px solid var(--line); border-radius: 16px; padding: 0 14px; min-height: 52px; }
.inp:focus-within { border-color: var(--accent); }
.inp input { border: 0; background: transparent; width: 100%; min-width: 0; font: 600 17px var(--font); color: var(--ink); padding: 12px 0; outline: none; }
.inp .u { color: var(--mute); font-size: 13px; font-weight: 600; margin-left: 6px; }

.ages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.age { position: relative; border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; color: var(--mute); }
.age b { font-size: 20px; line-height: 1; font-weight: 800; }
.age small { font-size: 11px; margin-top: 3px; }
.age[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.age.done::after { content: "✓"; position: absolute; top: 3px; right: 6px; font-size: 11px; font-weight: 800; color: var(--ok); }
.age[aria-pressed="true"].done::after { color: var(--accent-ink); }
.rec { display: grid; grid-template-columns: 1fr 1fr; background: var(--accent-soft); border-radius: 18px; }
.rec > div { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.rec > div + div { border-left: 1px solid var(--line); }
.rec .l { font-size: 12px; font-weight: 600; color: var(--mute); }
.rec .v { font-size: 26px; font-weight: 800; color: var(--accent); }
.rec .v small { font-size: 12px; font-weight: 600; color: var(--mute); }
.delta { font-size: 13px; font-weight: 600; color: var(--mute); }
.delta.neg { color: var(--warn); }
.delta.pos { color: var(--ok); }

.sum { background: var(--deep); color: var(--deep-ink); border-radius: 24px; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.sum > div + div { border-left: 1px solid rgba(255,255,255,.18); padding-left: 16px; text-align: right; }
.sum .l { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--deep-mute); font-weight: 600; }
.sum .v { font-size: 32px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
.sum .s { font-size: 12px; color: var(--deep-mute); margin-top: 2px; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 18px; min-height: 56px; font-weight: 700; font-size: 17px; width: 100%; }
.btn.ghost { background: var(--card); color: var(--accent); border: 1.5px solid var(--accent); min-height: 52px; }
.btn.danger { background: var(--card); color: var(--danger); border: 1.5px solid var(--danger); min-height: 48px; font-size: 15px; }
.btn.danger.sure { background: var(--danger); color: #fff; }
.hint { text-align: center; font-size: 13px; color: var(--mute); margin: 0; }

.list { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 14px; background: var(--card); border: 0; border-radius: 20px; padding: 16px; text-align: left; width: 100%; }
.row .ico { width: 46px; height: 46px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 16px; flex: none; }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.row .tx span { display: block; font-size: 13px; color: var(--mute); margin-top: 2px; }
.row .chev { color: var(--mute); font-size: 22px; }
.chip { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.sec { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); font-weight: 600; margin: 4px 4px 0; }
.empty { background: var(--card); border-radius: 24px; padding: 28px 20px; text-align: center; color: var(--mute); }
.empty b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; }
.addrow { display: flex; gap: 10px; }
.addrow .inp { flex: 1; background: var(--card); }
.addrow .btn { width: auto; padding: 0 20px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button { border: 1px solid var(--line); background: var(--field); border-radius: 14px; min-height: 48px; font-weight: 700; font-size: 14px; color: var(--mute); padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.modal { position: fixed; inset: 0; background: rgba(15, 23, 30, .55); display: grid; place-items: center; padding: 20px; z-index: 50; }
.dlg { background: var(--card); border-radius: 24px; padding: 24px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
.dlg h2 { font-size: 20px; }
.dlg p { margin: 0; color: var(--mute); font-size: 15px; }
.swipe { position: relative; border-radius: 20px; overflow: hidden; }
.swipe .acts { position: absolute; inset: 0 0 0 auto; width: 152px; display: flex; opacity: 0; }
.swipe.open .acts, .swipe.dragging .acts { opacity: 1; }
.act { flex: 1; border: 0; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 12px; font-weight: 700; }
.act svg { width: 22px; height: 22px; }
.act.edit { background: var(--accent); }
.act.del { background: var(--danger); }
.swipe .row { position: relative; touch-action: pan-y; transition: transform .4s cubic-bezier(.25, .8, .3, 1), border-radius .4s ease; }
.swipe .row.drag { transition: none; }
.swipe.open .row, .swipe.dragging .row { border-radius: 20px 0 0 20px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.dbtn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--deep); color: var(--deep-ink); padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 20; max-width: 90vw; text-align: center; }
.toast[hidden] { display: none; }
</style>
</head>
<body>
<main class="app" id="app"></main>
<div class="toast" id="toast" hidden></div>
<script src="jspdf.umd.min.js"></script>
<script>
"use strict";
const DIAS = [7, 14, 21, 28, 35];
const MULT = { 7: 4.3, 14: 2.5, 21: 2, 28: 1.7, 35: 1.5 };
const ANT = { 14: 7, 21: 14, 28: 21, 35: 28 };
const KEY = "controle-alojamento.v1";
const VERSAO = "1.8";
const TIPOS = ["Convencional", "Modal", "Dark House"];
let tipoSel = TIPOS[0];

// ---------- dados (salvos no aparelho) ----------
let db = { aviarios: [] };
let memoria = null;
function carregar() {
  try { const t = localStorage.getItem(KEY); if (t) db = JSON.parse(t); } catch (e) { if (memoria) db = memoria; }
  if (!db || !Array.isArray(db.aviarios)) db = { aviarios: [] };
  db.aviarios.forEach((a) => (a.lotes || []).forEach((l) => { l.lote = String(l.lote ?? "").replace(/\D/g, "");
    if (!l.oc || "mortos" in l.oc || "caq" in l.oc || "prob" in l.oc || "outros" in l.oc) l.oc = l.oc && Object.keys(l.oc).length ? { 7: l.oc } : {};
  }));
}
function salvar() {
  memoria = db;
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
}
carregar();

// ---------- utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
let tela = "aviarios", av = null, lt = null, idade = 7;
const hoje = new Date();
const pad = (n) => String(n).padStart(2, "0");
const isoHoje = () => hoje.getFullYear() + "-" + pad(hoje.getMonth() + 1) + "-" + pad(hoje.getDate());
const num = (v) => { const n = parseFloat(String(v ?? "").replace(",", ".")); return Number.isFinite(n) ? n : 0; };
const fmt = (n, d = 3) => n.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtI = (n) => n.toLocaleString("pt-BR");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const brData = (d) => d.split("-").reverse().join("/");
const diasDe = (data) => Math.max(0, Math.floor((new Date(isoHoje() + "T00:00:00") - new Date(data + "T00:00:00")) / 864e5));
const totalOc = (o) => (o ? num(o.mortos) + num(o.caq) + num(o.prob) + num(o.outros) : 0);
const somaOc = (l, campo) => DIAS.reduce((t, d) => t + num((l.oc[d] || {})[campo]), 0);
const totalLote = (l) => DIAS.reduce((t, d) => t + totalOc(l.oc[d]), 0);
const pctMortos = (l) => (num(l.alojada) > 0 ? (somaOc(l, "mortos") / num(l.alojada)) * 100 : 0);
const idadeAtual = (l) => { const d = diasDe(l.data); return DIAS.find((x) => d <= x) || 35; };
function recomendado(l, d) {
  if (d === 7) return l.pinto * MULT[7];
  const a = ANT[d];
  return (l.pesos[a] || recomendado(l, a)) * MULT[d];
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.id); toast.id = setTimeout(() => (t.hidden = true), 2200); }
const novoId = () => Date.now() + Math.floor(Math.random() * 1000);

function topo(titulo, eyebrow, back, extra = "") {
  return `<div class="top">${back ? `<button class="back" id="voltar" aria-label="Voltar">‹</button>` : `<div class="badge">CA</div>`}
  <div class="top-text"><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(titulo)}</h1></div>${extra}</div>`;
}
function campo(id, rotulo, valor, o = {}) {
  return `<div class="f"><label for="${id}">${rotulo}</label><div class="inp"><input id="${id}" value="${esc(valor)}" inputmode="${o.mode || "decimal"}" ${o.ph ? `placeholder="${o.ph}"` : ""} autocomplete="off">${o.u ? `<span class="u">${o.u}</span>` : ""}</div></div>`;
}

const nomeLote = (l) => "Lote " + (l.lote || "sem número");
function perguntar(titulo, texto, simTxt, naoTxt) {
  return new Promise((resolve) => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">${esc(titulo)}</h2><p>${esc(texto)}</p><div class="dbtn"><button class="btn ghost" id="dn">${esc(naoTxt)}</button><button class="btn" id="ds">${esc(simTxt)}</button></div></div>`;
    document.body.appendChild(m);
    const fim = (r) => { m.remove(); resolve(r); };
    $("#ds", m).onclick = () => fim(true);
    $("#dn", m).onclick = () => fim(false);
    $("#dn", m).focus();
  });
}

// Exclusão protegida: só habilita o botão depois de digitar "excluir".
function digitarParaExcluir(titulo, texto) {
  return new Promise((resolve) => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">${esc(titulo)}</h2><p>${esc(texto)}</p>
      <div class="f"><label for="dig">Para confirmar, digite <b>excluir</b></label><div class="inp"><input id="dig" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="excluir"></div></div>
      <div class="dbtn"><button class="btn ghost" id="dn">Cancelar</button><button class="btn danger" id="ds" disabled>Excluir</button></div></div>`;
    document.body.appendChild(m);
    const dig = $("#dig", m), ds = $("#ds", m);
    const fim = (r) => { m.remove(); resolve(r); };
    dig.addEventListener("input", () => { ds.disabled = dig.value.trim().toLowerCase() !== "excluir"; });
    ds.onclick = () => { if (!ds.disabled) fim(true); };
    $("#dn", m).onclick = () => fim(false);
    dig.focus();
  });
}

function msgExcluirAviario(a) {
  const n = a.lotes.length;
  return "Isso apaga o aviário" + (n === 0 ? "" : n === 1 ? " e o lote dele" : " e os " + n + " lotes dele") + ". Não dá pra desfazer.";
}

// Arrastar o aviário pro lado mostra Editar e Excluir (como nas conversas do WhatsApp).
let swipeAberto = null, swipeGlobal = false;
function fecharSwipe() {
  if (!swipeAberto) return;
  swipeAberto.classList.remove("open");
  const r = swipeAberto.querySelector(".row"); if (r) r.style.transform = "";
  swipeAberto = null;
}
function ligarSwipe() {
  const W = 152;
  swipeAberto = null;
  if (!swipeGlobal) { swipeGlobal = true; document.addEventListener("pointerdown", (e) => { if (swipeAberto && !swipeAberto.contains(e.target)) fecharSwipe(); }); }
  app.querySelectorAll(".swipe").forEach((sw) => {
    const row = sw.querySelector(".row");
    let x0 = 0, y0 = 0, base = 0, dx = 0, ativo = false, arrastou = false, pid = null;
    row.addEventListener("pointerdown", (e) => { x0 = e.clientX; y0 = e.clientY; base = sw.classList.contains("open") ? -W : 0; dx = base; ativo = true; arrastou = false; pid = e.pointerId; });
    row.addEventListener("pointermove", (e) => {
      if (!ativo) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!arrastou) {
        if (Math.abs(mx) < 8 || Math.abs(mx) < Math.abs(my)) return;
        arrastou = true;
        if (swipeAberto && swipeAberto !== sw) fecharSwipe();
        sw.classList.add("dragging"); row.classList.add("drag");
        try { row.setPointerCapture(pid); } catch (_) {}
      }
      dx = Math.max(-W, Math.min(0, base + mx));
      row.style.transform = "translateX(" + dx + "px)";
    });
    const fim = () => {
      if (!ativo) return;
      ativo = false;
      if (!arrastou) return;
      row.classList.remove("drag"); sw.classList.remove("dragging");
      sw._bloq = true; setTimeout(() => { sw._bloq = false; }, 80);
      if (dx < -W / 2) { row.style.transform = "translateX(-" + W + "px)"; sw.classList.add("open"); swipeAberto = sw; }
      else { row.style.transform = ""; sw.classList.remove("open"); if (swipeAberto === sw) swipeAberto = null; }
    };
    row.addEventListener("pointerup", fim);
    row.addEventListener("pointercancel", fim);
  });
}

// Peso: digitou 0 (ou 0 seguido de número), a vírgula entra sozinha: 0959 vira 0,959. Apagar continua livre.
function maskPeso(e) {
  if (e.inputType && !e.inputType.startsWith("insert")) return;
  let v = e.target.value.replace(/\./g, ",").replace(/[^\d,]/g, "");
  const i = v.indexOf(",");
  if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/,/g, "");
  else if (/^0\d?/.test(v) && v.length >= 1) v = "0," + v.slice(1);
  e.target.value = v;
}

// voltar do Android / gesto
window.__back = () => {
  const aviso = document.querySelector(".modal #dn");
  if (aviso) { aviso.click(); return true; }
  if (tela === "registro") { irLotes(); return true; }
  if (tela === "lotes") { irAviarios(); return true; }
  return false;
};

function segHtml(sel) {
  return `<div class="f"><label>Tipo de aviário</label><div class="seg" role="group" aria-label="Tipo de aviário">${TIPOS.map((t) => `<button type="button" data-t="${t}" aria-pressed="${t === sel}">${t}</button>`).join("")}</div></div>`;
}
function ligarSeg() {
  app.querySelectorAll(".seg [data-t]").forEach((b) => (b.onclick = () => { tipoSel = b.dataset.t; app.querySelectorAll(".seg [data-t]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }));
}

// ---------- tela 1: aviários ----------
function irAviarios() { tela = "aviarios"; av = null; lt = null; telaAviarios(); }
function telaAviarios(adicionando = false) {
  const lista = db.aviarios.length
    ? `<div class="sec">Meus aviários</div><div class="list">${db.aviarios.map((a) => {
        const ativo = a.lotes.some((l) => !l.encerrado);
        return `<div class="swipe"><div class="acts">
          <button class="act edit" data-ed="${a.id}" aria-label="Editar ${esc(a.nome)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Editar</button>
          <button class="act del" data-ex="${a.id}" aria-label="Excluir ${esc(a.nome)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>Excluir</button></div>
        <button class="row" data-av="${a.id}"><div class="ico">${esc((a.nome.match(/\d+/) || [a.nome.charAt(0).toUpperCase() || "A"])[0])}</div>
        <div class="tx"><b>${esc(a.nome)}</b><span>${esc(a.tipo || TIPOS[0])} · ${ativo ? "Lote em andamento" : "Sem lote"} · ${a.lotes.length} ${a.lotes.length === 1 ? "lote" : "lotes"}</span></div><span class="chev">›</span></button></div>`;
      }).join("")}</div><p class="hint">Toque num aviário para ver os lotes. Arraste pro lado para editar ou excluir.</p>`
    : `<div class="empty"><b>Nenhum aviário ainda</b>Toque em "Novo aviário" para começar.</div>`;
  app.innerHTML = topo("Aviários", "Controle de peso e mortalidade") +
    (adicionando
      ? `<div class="card"><div class="f"><label for="nomeAv">Nome do aviário</label><div class="inp"><input id="nomeAv" placeholder="Ex.: Aviário 1" autocomplete="off" maxlength="40"></div></div>${segHtml(tipoSel)}<button class="btn" id="okAv">Criar aviário</button></div>`
      : `<button class="btn" id="novoAv">+ Novo aviário</button>`) + lista;
  if (adicionando) {
    const inp = $("#nomeAv"); inp.focus(); ligarSeg();
    const criar = () => {
      const nome = inp.value.trim();
      if (!nome) { telaAviarios(false); return; }
      db.aviarios.push({ id: novoId(), nome, tipo: tipoSel, lotes: [] }); salvar(); telaAviarios(false); toast(nome + " criado");
    };
    $("#okAv").onclick = criar;
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") criar(); });
  } else {
    $("#novoAv").onclick = () => { tipoSel = TIPOS[0]; telaAviarios(true); };
  }
  app.insertAdjacentHTML("beforeend", `<p class="hint">Versão ${VERSAO}</p>`);
  app.querySelectorAll("[data-av]").forEach((b) => (b.onclick = () => {
    const sw = b.closest(".swipe");
    if (sw._bloq) return;
    if (sw.classList.contains("open")) { fecharSwipe(); return; }
    av = db.aviarios.find((a) => a.id == b.dataset.av); tela = "lotes"; telaLotes();
  }));
  app.querySelectorAll("[data-ed]").forEach((b) => (b.onclick = () => {
    av = db.aviarios.find((a) => a.id == b.dataset.ed); tipoSel = av.tipo || TIPOS[0]; tela = "lotes"; telaLotes(true);
  }));
  app.querySelectorAll("[data-ex]").forEach((b) => (b.onclick = async () => {
    const a = db.aviarios.find((x) => x.id == b.dataset.ex);
    if (await digitarParaExcluir("Excluir " + a.nome + "?", msgExcluirAviario(a))) { db.aviarios = db.aviarios.filter((x) => x !== a); salvar(); telaAviarios(); toast("Aviário excluído"); }
    else fecharSwipe();
  }));
  ligarSwipe();
}

// ---------- tela 2: lotes do aviário ----------
function irLotes() { tela = "lotes"; lt = null; telaLotes(); }
function linhaLote(l) {
  const p = pctMortos(l);
  const feito = DIAS.filter((d) => l.pesos[d]).length;
  return `<button class="row" data-lt="${l.id}"><div class="ico">${esc(l.lote || "?")}</div>
  <div class="tx"><b>${esc(nomeLote(l))}</b><span>Alojado em ${brData(l.data)} · dia ${diasDe(l.data)} · ${fmtI(num(l.alojada))} aves</span>
  <span>${feito} de 5 pesagens · cama ${num(l.cama) || "–"}ª vez</span></div>
  <span class="chip ${p > 4 ? "warn" : ""}">${fmt(p, 2)}% mortos</span></button>`;
}
function telaLotes(editando = false) {
  const atual = av.lotes.find((l) => !l.encerrado);
  const antigos = av.lotes.filter((l) => l.encerrado);
  app.innerHTML = topo(av.nome, "Lotes · " + (av.tipo || TIPOS[0]), true) +
    (editando ? `<div class="card"><div class="f"><label for="nomeAv">Nome do aviário</label><div class="inp"><input id="nomeAv" value="${esc(av.nome)}" maxlength="40" autocomplete="off"></div></div>${segHtml(tipoSel)}<button class="btn" id="okNome">Salvar alterações</button></div>` : "") +
    (atual ? `<div class="sec">Lote atual</div><div class="list">${linhaLote(atual)}</div>`
      : `<button class="btn" id="novoLote">+ Novo lote</button><p class="hint">Este aviário está sem lote. Crie o próximo quando alojar.</p>`) +
    (antigos.length ? `<div class="sec">Lotes anteriores</div><div class="list">${antigos.map(linhaLote).join("")}</div>` : "") +
    `<button class="btn ghost" id="edAv">Editar aviário</button><button class="btn danger" id="exAv">Excluir aviário</button>`;
  $("#voltar").onclick = irAviarios;
  $("#edAv").onclick = () => { tipoSel = av.tipo || TIPOS[0]; telaLotes(true); };
  if (editando) {
    const inp = $("#nomeAv"); inp.focus(); inp.select(); ligarSeg();
    const ok = () => { const n = inp.value.trim(); if (n) av.nome = n; av.tipo = tipoSel; salvar(); toast("Aviário salvo"); telaLotes(false); };
    $("#okNome").onclick = ok;
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") ok(); });
  }
  const nl = $("#novoLote");
  if (nl) nl.onclick = () => {
    const ultimo = antigos[0];
    const n = { id: novoId(), lote: String(Math.max(0, ...av.lotes.map((x) => num(x.lote))) + 1), data: isoHoje(), alojada: 0, cama: ultimo ? num(ultimo.cama) + 1 : 1, pinto: 0.045, pesos: {}, oc: {}, encerrado: false };
    av.lotes.unshift(n); salvar(); lt = n; idade = 7; tela = "registro"; telaRegistro();
  };
  app.querySelectorAll("[data-lt]").forEach((b) => (b.onclick = () => { lt = av.lotes.find((l) => l.id == b.dataset.lt); idade = idadeAtual(lt); tela = "registro"; telaRegistro(); }));
  $("#exAv").onclick = async () => {
    if (await digitarParaExcluir("Excluir " + av.nome + "?", msgExcluirAviario(av))) {
      db.aviarios = db.aviarios.filter((a) => a !== av); salvar(); irAviarios(); toast("Aviário excluído");
    }
  };
}
function confirmar(sel, rotulo, aviso, fn) {
  const b = $(sel); let armado = false;
  b.onclick = () => {
    if (!armado) { armado = true; b.textContent = aviso; b.classList.add("sure"); setTimeout(() => { armado = false; b.textContent = rotulo; b.classList.remove("sure"); }, 4000); return; }
    fn();
  };
}

// ---------- tela 3: registro do lote ----------
function telaRegistro() {
  const o = lt.oc[idade] || {};
  app.innerHTML = topo("Registro do lote", av.nome + " · " + nomeLote(lt), true, `<span class="pill" id="estado">${lt.encerrado ? "Encerrado" : "Em andamento"}</span>`) +
    `<section class="card"><div class="card-head"><div class="step">01</div><div><h2>Dados do lote</h2><p>Informações gerais do alojamento</p></div></div>
      <div class="grid2">
        ${campo("f-data", "Data aloja.", brData(lt.data), { mode: "numeric", ph: "dd/mm/aaaa" })}
        ${campo("f-alojada", "Quant. alojada", lt.alojada || "", { mode: "numeric", ph: "0" })}
        ${campo("f-cama", "Cama (nº de usos)", lt.cama || "", { mode: "numeric", ph: "1" })}
        ${campo("f-lote", "Lote (número)", lt.lote, { mode: "numeric", ph: "1" })}
        ${campo("f-pinto", "Peso pinto (referência)", fmt(lt.pinto), { u: "kg" })}
      </div></section>
    <section class="card"><div class="card-head"><div class="step">02</div><div><h2>Idade do lote</h2><p>O recomendado é calculado a partir do peso pinto</p></div></div>
      <div class="ages" role="group" aria-label="Idade do lote">${DIAS.map((d) => `<button class="age ${lt.pesos[d] || totalOc(lt.oc[d]) > 0 ? "done" : ""}" data-d="${d}" aria-pressed="${d === idade}"><b>${d}</b><small>dias</small></button>`).join("")}</div>
      <div class="rec"><div><span class="l">Peso recomendado</span><span class="v" id="rec"></span></div>
        <div><span class="l">Multiplicador</span><span class="v" id="mult"></span><span class="delta" id="base"></span></div></div>
      ${campo("f-peso", `Peso aos ${idade} dias`, lt.pesos[idade] ? fmt(lt.pesos[idade]) : "", { u: "kg", ph: "0,000" })}
      <div class="delta" id="delta"></div></section>
    <section class="card"><div class="card-head"><div class="step">03</div><div><h2>Ocorrências</h2><p>Aos ${idade} dias. Cada idade tem a sua.</p></div></div>
      <div class="grid2">
        ${campo("o-mortos", "Mortos", o.mortos || "", { mode: "numeric", ph: "0" })}
        ${campo("o-caq", "Caq. / Ref.", o.caq || "", { mode: "numeric", ph: "0" })}
        ${campo("o-prob", "Prob. loc.", o.prob || "", { mode: "numeric", ph: "0" })}
        ${campo("o-outros", "Outros", o.outros || "", { mode: "numeric", ph: "0" })}
      </div></section>
    <section class="sum"><div><div class="l">Total do lote</div><div class="v" id="tot"></div><div class="s" id="totS"></div></div>
      <div><div class="l">% mortos</div><div class="v" id="pct"></div><div class="s">mortos ÷ alojadas, todas as idades</div></div></section>
    <button class="btn" id="salvar">Salvar registro</button>
    <p class="hint">Tudo é salvo no aparelho conforme você digita.</p>
    <button class="btn ghost" id="pdf">Compartilhar PDF no WhatsApp</button>
    ${lt.encerrado ? "" : `<button class="btn ghost" id="encerrar">Encerrar lote (abate)</button>`}
    <button class="btn danger" id="exLote">Excluir lote</button>`;
  calcular(false);

  const ligar = (id, fn) => $(id).addEventListener("input", (e) => { fn(e.target.value); salvar(); calcular(true); });
  const fData = $("#f-data");
  fData.addEventListener("input", (e) => {
    const d = e.target.value.replace(/\D/g, "").slice(0, 8);
    e.target.value = d.length > 4 ? d.slice(0, 2) + "/" + d.slice(2, 4) + "/" + d.slice(4) : d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d;
  });
  // Só troca a data depois de confirmar. Em branco, pergunta se pode usar a data de hoje.
  fData.addEventListener("change", async () => {
    const d = fData.value.replace(/\D/g, "");
    const volta = () => { fData.value = brData(lt.data); };
    if (d.length === 0) {
      const hoje = isoHoje();
      if (hoje !== lt.data && await perguntar("Data em branco", "Usar a data de hoje (" + brData(hoje) + ") como data de alojamento?", "Sim, usar hoje", "Não")) { lt.data = hoje; salvar(); }
      volta(); calcular(true); return;
    }
    let nova = null;
    if (d.length === 8) {
      const dia = +d.slice(0, 2), mes = +d.slice(2, 4), ano = +d.slice(4);
      const dt = new Date(ano, mes - 1, dia);
      if (dt.getFullYear() === ano && dt.getMonth() === mes - 1 && dt.getDate() === dia) nova = ano + "-" + d.slice(2, 4) + "-" + d.slice(0, 2);
    }
    if (!nova) { toast("Data inválida. Use dia/mês/ano"); volta(); return; }
    if (nova === lt.data) { volta(); return; }
    if (await perguntar("Trocar a data de alojamento?", "De " + brData(lt.data) + " para " + brData(nova) + ". Isso muda a idade e o dia do lote.", "Sim, trocar", "Não, manter")) { lt.data = nova; salvar(); }
    volta(); calcular(true);
  });
  ligar("#f-alojada", (v) => (lt.alojada = num(v)));
  ligar("#f-cama", (v) => (lt.cama = num(v)));
  $("#f-lote").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6); });
  ligar("#f-lote", (v) => (lt.lote = v));
  $("#f-pinto").addEventListener("input", maskPeso);
  $("#f-peso").addEventListener("input", maskPeso);
  ligar("#f-pinto", (v) => (lt.pinto = num(v)));
  ligar("#f-peso", (v) => { if (num(v) > 0) lt.pesos[idade] = num(v); else delete lt.pesos[idade]; });
  [["mortos", "#o-mortos"], ["caq", "#o-caq"], ["prob", "#o-prob"], ["outros", "#o-outros"]].forEach(([k, id]) => ligar(id, (v) => { lt.oc[idade] = lt.oc[idade] || {}; lt.oc[idade][k] = num(v); }));
  app.querySelectorAll(".age").forEach((b) => (b.onclick = () => { idade = +b.dataset.d; telaRegistro(); }));
  $("#voltar").onclick = irLotes;
  $("#salvar").onclick = () => { salvar(); const e = $("#estado"); e.textContent = "Salvo"; e.classList.add("saved"); toast("Registro salvo"); };
  $("#pdf").onclick = compartilharPdf;
  const enc = $("#encerrar");
  if (enc) confirmar("#encerrar", "Encerrar lote (abate)", "Toque de novo para encerrar este lote", () => { lt.encerrado = true; salvar(); irLotes(); toast("Lote encerrado. Já pode criar o próximo"); });
  $("#exLote").onclick = async () => {
    if (await digitarParaExcluir("Excluir " + nomeLote(lt) + "?", "Isso apaga o lote e todos os pesos e ocorrências dele. Não dá pra desfazer.")) {
      av.lotes = av.lotes.filter((l) => l !== lt); salvar(); irLotes(); toast("Lote excluído");
    }
  };
}

function calcular(editou) {
  const rec = recomendado(lt, idade);
  $("#rec").innerHTML = fmt(rec) + " <small>kg</small>";
  $("#mult").textContent = fmt(MULT[idade], 1) + "×";
  $("#base").textContent = idade === 7 ? "do peso do pinto" : "do peso aos " + ANT[idade] + " dias";
  const p = lt.pesos[idade], dl = $("#delta");
  if (p) { const d = ((p - rec) / rec) * 100; dl.textContent = (d >= 0 ? "+" : "") + fmt(d, 1) + "% em relação ao recomendado"; dl.className = "delta " + (d < -5 ? "neg" : d > 5 ? "pos" : ""); }
  else { dl.textContent = "Digite o peso para comparar com o recomendado."; dl.className = "delta"; }
  $("#tot").textContent = fmtI(totalLote(lt));
  $("#totS").textContent = "aos " + idade + " dias: " + fmtI(totalOc(lt.oc[idade]));
  $("#pct").textContent = num(lt.alojada) > 0 ? fmt(pctMortos(lt), 2) + "%" : "–";
  const b = app.querySelector(`.age[data-d="${idade}"]`); if (b) b.classList.toggle("done", !!lt.pesos[idade] || totalOc(lt.oc[idade]) > 0);
  if (editou) { const e = $("#estado"); e.textContent = lt.encerrado ? "Encerrado" : "Em andamento"; e.classList.remove("saved"); }
}

// ---------- PDF ----------
function montarPdf() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210, M = 16;
  doc.setFillColor(29, 98, 114); doc.rect(0, 0, W, 34, "F");
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(20);
  doc.text("Controle de peso e mortalidade", M, 16);
  doc.setFont("helvetica", "normal"); doc.setFontSize(12);
  doc.text(av.nome + " (" + (av.tipo || TIPOS[0]) + ")  |  " + nomeLote(lt), M, 26);
  doc.setTextColor(20, 34, 47);
  let y = 46;
  const par = (a, b) => { doc.setFont("helvetica", "normal"); doc.setTextColor(107, 124, 137); doc.setFontSize(10); doc.text(a, M, y); doc.setTextColor(20, 34, 47); doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.text(b, M, y + 6); };
  const par2 = (x, a, b) => { doc.setFont("helvetica", "normal"); doc.setTextColor(107, 124, 137); doc.setFontSize(10); doc.text(a, x, y); doc.setTextColor(20, 34, 47); doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.text(b, x, y + 6); };
  par2(M, "Data de alojamento", brData(lt.data));
  par2(M + 62, "Quantidade alojada", fmtI(num(lt.alojada)));
  par2(M + 124, "Cama (nº de usos)", String(num(lt.cama) || "-"));
  y += 18;
  par2(M, "Peso do pinto (referência)", fmt(lt.pinto) + " kg");
  par2(M + 62, "Dia do lote", String(diasDe(lt.data)));
  par2(M + 124, "Situação", lt.encerrado ? "Encerrado" : "Em andamento");
  y += 20;
  doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.text("Pesagens", M, y); y += 4;
  const cols = [M, M + 28, M + 76, M + 124, M + 156];
  doc.setFillColor(230, 240, 242); doc.rect(M, y, W - 2 * M, 9, "F");
  doc.setFontSize(10); doc.setTextColor(29, 98, 114);
  ["Idade", "Peso recomendado", "Peso real", "Diferença"].forEach((t, i) => doc.text(t, cols[i] + 2, y + 6));
  y += 9; doc.setFont("helvetica", "normal"); doc.setTextColor(20, 34, 47); doc.setFontSize(11);
  DIAS.forEach((d) => {
    const rec = recomendado(lt, d), p = lt.pesos[d];
    doc.text(d + " dias", cols[0] + 2, y + 6.5);
    doc.text(fmt(rec) + " kg", cols[1] + 2, y + 6.5);
    doc.text(p ? fmt(p) + " kg" : "-", cols[2] + 2, y + 6.5);
    doc.text(p ? (((p - rec) / rec) * 100 >= 0 ? "+" : "") + fmt(((p - rec) / rec) * 100, 1) + "%" : "-", cols[3] + 2, y + 6.5);
    doc.setDrawColor(217, 225, 230); doc.line(M, y + 10, W - M, y + 10);
    y += 10;
  });
  y += 12;
  doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(20, 34, 47); doc.text("Ocorrências por idade", M, y); y += 4;
  const oc = [M, M + 28, M + 64, M + 100, M + 130, M + 156];
  doc.setFillColor(230, 240, 242); doc.rect(M, y, W - 2 * M, 9, "F");
  doc.setFontSize(10); doc.setTextColor(29, 98, 114);
  ["Idade", "Mortos", "Caq. / Ref.", "Prob. loc.", "Outros", "Total"].forEach((t, i) => doc.text(t, oc[i] + 2, y + 6));
  y += 9; doc.setFont("helvetica", "normal"); doc.setTextColor(20, 34, 47); doc.setFontSize(11);
  DIAS.forEach((d) => {
    const o = lt.oc[d];
    doc.text(d + " dias", oc[0] + 2, y + 6.5);
    [o && o.mortos, o && o.caq, o && o.prob, o && o.outros].forEach((v, i) => doc.text(o ? fmtI(num(v)) : "-", oc[i + 1] + 2, y + 6.5));
    doc.text(o ? fmtI(totalOc(o)) : "-", oc[5] + 2, y + 6.5);
    doc.setDrawColor(217, 225, 230); doc.line(M, y + 10, W - M, y + 10);
    y += 10;
  });
  doc.setFont("helvetica", "bold");
  doc.text("Total", oc[0] + 2, y + 6.5);
  ["mortos", "caq", "prob", "outros"].forEach((c, i) => doc.text(fmtI(somaOc(lt, c)), oc[i + 1] + 2, y + 6.5));
  doc.text(fmtI(totalLote(lt)), oc[5] + 2, y + 6.5);
  y += 10;
  y += 10;
  doc.setFillColor(34, 56, 83); doc.roundedRect(M, y, W - 2 * M, 26, 4, 4, "F");
  doc.setTextColor(159, 176, 195); doc.setFontSize(9);
  doc.text("TOTAL DO LOTE (todas as idades)", M + 8, y + 9); doc.text("% MORTOS (mortos ÷ alojadas)", M + 100, y + 9);
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(20);
  doc.text(fmtI(totalLote(lt)), M + 8, y + 20); doc.text(num(lt.alojada) > 0 ? fmt(pctMortos(lt), 2) + "%" : "-", M + 100, y + 20);
  doc.setTextColor(107, 124, 137); doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  doc.text("Gerado em " + brData(isoHoje()) + " pelo app Controle de Peso e Mortalidade (versão " + VERSAO + ")", M, 288);
  return doc;
}
async function compartilharPdf() {
  try {
    const doc = montarPdf();
    const nome = (av.nome + " - " + nomeLote(lt)).replace(/[\\/:*?"<>|]/g, "-") + ".pdf";
    const msg = av.nome + " | " + nomeLote(lt) + " | alojado em " + brData(lt.data);
    if (window.AndroidBridge && AndroidBridge.sharePdf) { AndroidBridge.sharePdf(doc.output("datauristring").split(",")[1], nome, msg); return; }
    const arq = new File([doc.output("blob")], nome, { type: "application/pdf" });
    if (navigator.canShare && navigator.canShare({ files: [arq] })) { await navigator.share({ files: [arq], title: nome, text: msg }); }
    else { doc.save(nome); toast("PDF baixado"); }
  } catch (e) { if (e && e.name !== "AbortError") toast("Não foi possível gerar o PDF"); }
}

// PWA: ao abrir ou voltar pro app, confere se saiu versão nova e recarrega sozinho (uma vez por versão).
async function verificarAtualizacao() {
  if (!location.protocol.startsWith("http")) return;
  try {
    const r = await fetch("./index.html?v=" + Date.now(), { cache: "no-store" });
    const m = (await r.text()).match(/const VERSAO = "([^"]+)"/);
    if (!m || m[1] === VERSAO) return;
    let ja = null; try { ja = sessionStorage.getItem("ca.recarregou"); } catch (e) {}
    if (ja === m[1]) return;
    try { sessionStorage.setItem("ca.recarregou", m[1]); } catch (e) {}
    toast("Versão nova " + m[1] + ", atualizando...");
    setTimeout(() => location.reload(), 900);
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") verificarAtualizacao(); });
verificarAtualizacao();

telaAviarios();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
